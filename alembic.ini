# Alembic config for data-governance.
#
# Per ADR-0002 we use Alembic without the SQLAlchemy ORM — migrations are
# hand-written SQL via op.execute(...). The DB URL is loaded from the
# DATABASE_URL environment variable inside env.py; sqlalchemy.url here is
# intentionally left empty so a misconfiguration fails loudly rather than
# silently using a placeholder.

[alembic]
script_location = data_governance/db/migrations
sqlalchemy.url =

# Filename template: a date prefix keeps versions sorted in the directory
# listing while Alembic still uses the down/up revision IDs to chain them.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Standard logging blocks Alembic ships with.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
