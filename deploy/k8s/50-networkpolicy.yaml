---
# Receiver NetworkPolicy.
#
# PROJECT.md §7 "Authentication and exposure":
#   v1 is unauthenticated and intended cluster-internal […] running it
#   outside an isolated cluster is unsupported.
#
# The NetworkPolicy IS the v1 security boundary. Ingress to the receiver
# is allowed only from the upstream Kagenti namespace, matched by the
# default `kubernetes.io/metadata.name` label every namespace gets, on
# the two OTLP transport ports (4317 gRPC, 4318 HTTP/protobuf).
#
# Prometheus /metrics scraping is intentionally NOT opened by this policy
# in v1. The receiver does serve /metrics on port 9090 (issue #36 wired
# MetricsServer into the receiver __main__, and 30-receiver.yaml exposes
# the port on the Service), but v1 has no monitoring peer in the cluster
# — PROJECT.md §1 keeps cluster-level monitoring explicitly out of scope.
# When a monitoring stack lands, add a scraper-namespace ingress rule
# here alongside the existing OTLP rules.
#
# Kubelet probe traffic (liveness/readiness on /healthz) originates on
# the node and is not subject to NetworkPolicy ingress filtering on every
# CNI we target — exempting the kubelet explicitly is unnecessary and
# would weaken the boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-governance-receiver-ingress
  namespace: data-governance
  labels:
    app.kubernetes.io/name: data-governance-receiver
    app.kubernetes.io/part-of: data-governance
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: data-governance-receiver
  policyTypes:
    - Ingress
  ingress:
    # Kagenti namespace: the OTel collector running there exports OTLP to us.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagenti
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
---
# UI backend NetworkPolicy.
#
# Same security boundary: allow ingress only from the Kagenti namespace
# (the cluster-internal consumer of the UI in v1 is whatever surface
# Kagenti operators reach the UI from — typically a port-forward or a
# Kagenti-namespace bastion / portal).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-governance-ui-ingress
  namespace: data-governance
  labels:
    app.kubernetes.io/name: data-governance-ui
    app.kubernetes.io/part-of: data-governance
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: data-governance-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagenti
      ports:
        - port: 8080
          protocol: TCP
---
# Postgres NetworkPolicy.
#
# Postgres is reachable only from inside the data-governance namespace —
# the receiver and UI backend are the only legitimate clients in v1.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-governance-postgres-ingress
  namespace: data-governance
  labels:
    app.kubernetes.io/name: data-governance-postgres
    app.kubernetes.io/part-of: data-governance
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: data-governance-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data-governance
      ports:
        - port: 5432
          protocol: TCP
