---
# Receiver NetworkPolicy.
#
# PROJECT.md §7 "Authentication and exposure":
#   v1 is unauthenticated and intended cluster-internal […] running it
#   outside an isolated cluster is unsupported.
#
# The NetworkPolicy IS the v1 security boundary. Ingress to the receiver
# is allowed only from the upstream platform namespace, matched by the
# default `kubernetes.io/metadata.name` label every namespace gets, on
# the two OTLP transport ports (4317 gRPC, 4318 HTTP/protobuf).
#
# `rossoctl-system`, `kagenti-system`, and `kagenti` are all accepted:
# PROJECT.md §7 refers to "the platform namespace" without pinning a literal
# name, and the platform's actual deployment uses `rossoctl-system` today
# (where the otel-collector lives) — historically `kagenti-system`. Admitting
# all three via `matchExpressions` keeps the policy portable across the
# rebrand and upstream topologies without weakening the boundary — none is a
# name a random unrelated workload would land in.
#
# Prometheus /metrics scraping is intentionally NOT opened by this policy
# in v1. The receiver does serve /metrics on port 9090 (issue #36 wired
# MetricsServer into the receiver __main__, and 30-receiver.yaml exposes
# the port on the Service), but v1 has no monitoring peer in the cluster
# — PROJECT.md §1 keeps cluster-level monitoring explicitly out of scope.
# When a monitoring stack lands, add a scraper-namespace ingress rule
# here alongside the existing OTLP rules.
#
# Kubelet probe traffic (liveness/readiness on /healthz) originates on
# the node and is not subject to NetworkPolicy ingress filtering on every
# CNI we target — exempting the kubelet explicitly is unnecessary and
# would weaken the boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-governance-receiver-ingress
  namespace: data-governance
  labels:
    app.kubernetes.io/name: data-governance-receiver
    app.kubernetes.io/part-of: data-governance
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: data-governance-receiver
  policyTypes:
    - Ingress
  ingress:
    # Platform namespace: the OTel collector running there exports OTLP to us.
    # `In: [rossoctl-system, kagenti-system, kagenti]` admits the current and
    # historical upstream namespace names (see header comment) using the
    # default `kubernetes.io/metadata.name` label every namespace carries.
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - rossoctl-system
                  - kagenti-system
                  - kagenti
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
---
# UI backend NetworkPolicy.
#
# Same security boundary: allow ingress only from the platform namespace
# (the cluster-internal consumer of the UI in v1 is whatever surface
# platform operators reach the UI from — the shared Gateway lives in
# `rossoctl-system` and its HTTPRoute proxies to this Service).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-governance-ui-ingress
  namespace: data-governance
  labels:
    app.kubernetes.io/name: data-governance-ui
    app.kubernetes.io/part-of: data-governance
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: data-governance-ui
  policyTypes:
    - Ingress
  ingress:
    # Same `rossoctl-system` / `kagenti-system` / `kagenti` admission as the
    # receiver policy — see the receiver-policy header for the rationale.
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - rossoctl-system
                  - kagenti-system
                  - kagenti
      ports:
        - port: 8080
          protocol: TCP
---
# Postgres NetworkPolicy.
#
# Postgres is reachable only from inside the data-governance namespace —
# the receiver and UI backend are the only legitimate clients in v1.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-governance-postgres-ingress
  namespace: data-governance
  labels:
    app.kubernetes.io/name: data-governance-postgres
    app.kubernetes.io/part-of: data-governance
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: data-governance-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data-governance
      ports:
        - port: 5432
          protocol: TCP
