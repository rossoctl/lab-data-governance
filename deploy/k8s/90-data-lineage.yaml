---
# P-data-lineage processor Deployment — a DB consumer, NOT an inbound API.
#
# Third sibling of the P-interactions (70-interactions.yaml) and P-classification
# (80-classification.yaml) drainers, and shaped like the first: it drains the
# `interaction_legs` stream by `seq` — woken by migration 0010's
# `dg_legs_inserted` NOTIFY channel, with the periodic poll as the correctness
# backstop — and writes the derived intra-trace data lineage:
# `lineage_metadata` (migration 0011, one row per payload-bearing leg, keyed
# `(interaction_id, leg_type)`; its third element renamed to `entities` by
# migration 0013 / ADR-0027 D10) plus `lineage_trace_status` (migration 0012,
# one row per trace recording `complete` vs `partial` coverage — ADR-0027 D6).
# It advances its OWN durable cursor in `processor_state` (the `data_lineage`
# row), independent of the `interactions` and `classification` cursors
# (data_governance/processors/data_lineage/driver.py).
#
# The whole algorithm is ADR-0027. Two of its properties are visible from here:
# the grain is a whole TRACE (`inbound(i)` spans every earlier leg — D1), so
# each arriving leg re-derives its entire trace; and trace scoping goes through
# a join on `interactions`, because neither `interaction_legs` nor
# `lineage_metadata` carries a `trace_id` (ADR-0025 keeps identity on the
# parent). That join is what keeps unrelated traces out of one lineage graph.
#
# Same image as the receiver — one repo-root Containerfile, one image, two
# tags; deployments differ only by `command:` (issue #38). No new image build.
# This is the P-interactions case, NOT the P-classification case:
# P-classification needs its own fat image solely because of torch + ~500 MB of
# baked-in model weights (ADR-0022/0023). Data lineage has no model and no
# inference — its only real dependency is psycopg, and the default matcher
# (`simple_match`) reads no payload content and pulls in nothing — so it rides
# the slim shared image and neither the Containerfile nor
# deploy/build-and-load.sh changes.
#
# Single replica (NOT 2 like the receiver), same single-shared-cursor reason as
# both siblings: the driver drains against ONE `processor_state` cursor with no
# inter-pod lock, so two replicas would poll the same cursor and re-derive the
# same traces.
#
# What makes a brief two-pod overlap SAFE here is NOT the sibling arguments, and
# the P-classification header's reasoning must not be read across:
# P-classification is write-once and idempotent (`ON CONFLICT (content_hash) DO
# NOTHING`), so for it "a brief overlap only duplicates work, never a row". Data
# lineage writes three things per leg — an `ON CONFLICT ... DO UPDATE` upsert of
# the derived rows, a `_delete_stale` pass removing this trace's rows the
# derivation no longer covers (ADR-0027 D9), and a `lineage_trace_status` upsert
# — so "write-once" is simply false, and two pods interleaving one's delete
# against the other's upsert would be a real hazard if the writes were loose.
# They are not loose: a derivation is a DETERMINISTIC function of committed
# state (the trace's legs, their entities, their payloads, and the configured
# matcher), and all three writes plus the cursor advance happen inside the ONE
# transaction the shared loop owns per item (ADR-0007's "one item, one
# transaction, cursor advances with the write"). Two concurrent derivations of
# the same trace therefore each see a consistent snapshot and compute the same
# rows, and converge on that same answer rather than corrupting each other; the
# loser's transaction is redundant, not destructive. Stated plainly: a same-trace
# overlap is WASTED WORK, and the correctness rests on determinism plus
# transaction scoping — not on the write being write-once.
#
# RollingUpdate with maxSurge:0 / maxUnavailable:1 keeps a VOLUNTARY
# (controller-driven) rollout from ever creating a second pod: the old pod is
# torn down before the replacement starts. It does NOT cover involuntary
# disruption — a node drain or eviction can start the replacement before the
# evicted pod's process exits, briefly running two cursors. Determinism +
# per-item transaction scoping (above), not the rollout strategy, is what makes
# that window safe. Running two replicas deliberately is still not a supported
# topology.
#
# Recovery is the shared one (ADR-0007): truncate the lineage tables, reset the
# `data_lineage` cursor row to 0, restart. Because every derived write commits
# with the cursor advance, there is no half-applied trace to reconcile.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-governance-data-lineage
  namespace: data-governance
  labels:
    app.kubernetes.io/name: data-governance-data-lineage
    app.kubernetes.io/part-of: data-governance
spec:
  replicas: 1
  strategy:
    # Single-cursor drainer: don't create a second pod during a rollout (see the
    # header note — involuntary eviction can still briefly overlap; that window
    # is made safe by the derivation being deterministic and wholly contained in
    # one transaction, not by this strategy). maxSurge:0 + maxUnavailable:1 tears
    # down the old pod before the replacement starts, the opposite of the
    # receiver's surge-first rollout.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: data-governance-data-lineage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-governance-data-lineage
        app.kubernetes.io/part-of: data-governance
    spec:
      initContainers:
        # ADR-0002: each pod runs `python -m data_governance.db.migrate` to
        # head before the processor container starts. Alembic's version table
        # makes this idempotent — running it from this pod as well as from the
        # receiver replicas and the sibling processors is safe (all migrate to
        # the same compiled head).
        - name: migrate
          image: data-governance/receiver:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "data_governance.db.migrate"]
          # Note: ``DATABASE_URL`` must come AFTER the POSTGRES_* entries it
          # references. Kubernetes only substitutes ``$(VAR)`` against names
          # defined earlier in the same env list — a forward reference
          # reaches the container as literal ``$(VAR)`` and breaks DSN
          # parsing (issue #40). The
          # ``test_container_env_placeholder_references_resolve_in_order``
          # regression test in tests/deploy/test_manifests.py pins this across
          # every manifest.
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: data-governance-postgres
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: data-governance-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: data-governance-postgres
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@data-governance-postgres:5432/$(POSTGRES_DB)"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
      containers:
        # The processor container runs the data-lineage entry point. Like the
        # receiver (PROJECT.md §3) and both siblings, it does NOT run Alembic
        # itself — the init container is the schema-ordering gate. The entry
        # point performs a defence-in-depth schema-version check on startup
        # (issue #10, ADR-0002) and exits non-zero on mismatch, surfacing as
        # CrashLoopBackOff.
        - name: data-lineage
          image: data-governance/receiver:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "data_governance.processors.data_lineage"]
          # See the ordering note on the migrate init container above —
          # ``DATABASE_URL`` must come after the POSTGRES_* entries it
          # references (issue #40). Env block is the receiver's verbatim.
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: data-governance-postgres
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: data-governance-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: data-governance-postgres
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@data-governance-postgres:5432/$(POSTGRES_DB)"
            # Which semantic matcher the lineage derivation is computed with
            # (data_governance/matching/config.py, resolved only through
            # get_matcher — lineage never names an implementation, ADR-0027).
            # Set to the same value as the code default, deliberately and
            # explicitly, following the INTERACTIONS_ALGORITHM precedent in
            # 70-interactions.yaml: "simple" is the trivial always-match
            # matcher (matched, no transformation, no evidence), which makes
            # the derived lineage COMPLETE BUT FULL OF MAYBES — every
            # structural edge in a trace is treated as real data flow. That is
            # a property an operator reading this manifest must see, not one to
            # be inferred from a default buried in the code. A real
            # (value-based, confidential-aware) matcher prunes those maybes
            # without touching the algorithm, and lands here as a one-word
            # change plus a registry entry.
            #
            # An unregistered name RAISES rather than silently falling back
            # (UnknownMatcher, issue #116) — validated before any DB work, so a
            # typo here is a loud CrashLoopBackOff, never silent
            # maybe-everywhere lineage under a real matcher's name.
            - name: SEMANTIC_MATCHER
              value: "simple"
          # No ports / no Service: the processor has no inbound API, and unlike
          # both siblings it serves no Prometheus /metrics surface at all — it
          # ships with no counters (issue #117), and a registry with nothing in
          # it would be a port to allocate for no signal
          # (data_governance/processors/data_lineage/__main__.py). When lineage
          # gets its first counter the metrics server goes in there in the
          # sibling shape, on the next free port after the receiver's 9090 /
          # P-interactions' 9091 / P-classification's 9092 — and v1 still would
          # not declare it, since the v1 NetworkPolicy has no monitoring peer.
          #
          # No liveness/readiness probes: there is no HTTP serving surface to
          # probe, and no Service routing traffic that a readiness gate would
          # protect. Kubernetes restarts the pod on process exit; the startup
          # schema-version check (issue #10) handles the "wrong image" failure
          # mode, and the SEMANTIC_MATCHER validation the "wrong config" one, by
          # exiting non-zero into CrashLoopBackOff.
          #
          # Sized like the interactions processor (100m/256Mi request, 1Gi cap),
          # NOT like classification's 500m/1Gi/3Gi — there is no model and no
          # inference here, so classification's headroom for torch + resident
          # weights buys nothing. The footprint that does matter is the
          # re-derive-per-leg grain: one whole trace is held in memory per
          # arriving leg (its legs, their entities, and — for a
          # content-reading matcher — their payloads), so usage scales with the
          # largest trace, not with stream throughput. 1Gi is generous for the
          # trace sizes v1 sees; a pathologically large trace is the failure
          # mode to watch, and it would show up as an OOMKill on this container
          # rather than as slow drift.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
