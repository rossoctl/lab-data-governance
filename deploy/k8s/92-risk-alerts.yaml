# Alerts processor Deployment (issues #104/#175) — a DB consumer, NOT an
# inbound API.
#
# Like the trace-trigger processor (91), this workload exposes NO Service and
# declares NO container ports. It drains `trace_risk_records` by `seq`
# (migration 0023), wakes on the `dg_trace_risk_written` LISTEN channel
# (same migration) plus the poll backstop, and writes `alerts`
# (create / duplicate_count / superseded_by per FR-DAS-040..043), advancing
# the durable `risk_alerts` cursor in `processor_state`
# (data_governance/processors/risk/alerts/driver.py).
#
# Same image as the receiver — one repo-root Containerfile, one image;
# deployments differ only by `command:` (issue #38). No new image build.
#
# Single replica: the driver drains against ONE shared `processor_state`
# cursor with no inter-pod lock. Each record's alert decision runs under a
# per-trace advisory lock and skips a record that already has an alert, so a
# brief involuntary overlap of two pods never creates a second alert; it can
# count one `duplicate` twice. Two replicas is not a supported topology.
#
# First start: the cursor begins at 0, so every trace risk record already in
# the table is replayed and each trace that reached the floor gets its alert,
# stamped with the replay's time (alerts carry no record time).
#
# The alert floor defaults to the PRD §10 value (RISK_ALERT_MIN_RISK_LEVEL=low)
# and is overridable via env; an unknown value stops the pod at startup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-governance-risk-alerts
  namespace: data-governance
  labels:
    app.kubernetes.io/name: data-governance-risk-alerts
    app.kubernetes.io/part-of: data-governance
spec:
  replicas: 1
  strategy:
    # Single-cursor drainer: don't create a second pod during a rollout (see
    # 70-interactions.yaml's header note — idempotency, not the rollout
    # strategy, is what makes the involuntary-overlap window safe).
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: data-governance-risk-alerts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-governance-risk-alerts
        app.kubernetes.io/part-of: data-governance
    spec:
      initContainers:
        # ADR-0002: each pod runs `python -m data_governance.db.migrate` to
        # head before the processor container starts. Alembic's version table
        # makes this idempotent across pods.
        - name: migrate
          image: data-governance/receiver:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "data_governance.db.migrate"]
          # ``DATABASE_URL`` must come AFTER the POSTGRES_* entries it
          # references (k8s only substitutes $(VAR) against names defined
          # earlier in the same env list — issue #40; pinned by
          # test_container_env_placeholder_references_resolve_in_order).
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: data-governance-postgres
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: data-governance-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: data-governance-postgres
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@data-governance-postgres:5432/$(POSTGRES_DB)"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
      containers:
        # The processor container runs the alerts entry point. It does
        # NOT run Alembic itself — the init container is the schema-ordering
        # gate; the entry point performs the defence-in-depth schema-version
        # check on startup (issue #10) and exits non-zero on mismatch.
        - name: risk-alerts
          image: data-governance/receiver:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "data_governance.processors.risk.alerts"]
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: data-governance-postgres
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: data-governance-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: data-governance-postgres
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@data-governance-postgres:5432/$(POSTGRES_DB)"
            # Alert titles and descriptions name rules from the deployed
            # catalog — the `rules_source.json` key of the `opa-policy`
            # ConfigMap OPA's policy is compiled from (95-opa.yaml), the same
            # source the UI's /risk/rules serves (40-ui.yaml) — not the copy
            # baked into the image. Until the ConfigMap exists, a record that
            # fired a rule holds the stream (the catalog is unavailable)
            # rather than being alerted with an unnamed rule.
            - name: RISK_RULES_SOURCE
              value: /policies/rules_source.json
          # No ports / no Service: the processor has no inbound API. Its
          # Prometheus /metrics surface (9096 in-pod) is intentionally
          # undeclared and unexposed, like the sibling processors (v1 has no
          # monitoring peer). No probes: no HTTP serving surface to probe;
          # Kubernetes restarts the pod on process exit.
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: policy
              mountPath: /policies
              readOnly: true
      volumes:
        # `optional`, as in 40-ui.yaml: the ConfigMap is created by
        # deploy/create-opa-configmap.sh, not by these manifests, so the pod
        # must start without it; the kubelet fills the mount once it exists.
        - name: policy
          configMap:
            name: opa-policy
            optional: true
            items:
              - key: rules_source.json
                path: rules_source.json
