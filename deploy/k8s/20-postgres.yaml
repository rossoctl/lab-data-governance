---
# Postgres Service — stable DNS name for receiver + UI backend.
#
# Headless ClusterIP (clusterIP: None) is conventional for StatefulSets but
# we use a regular ClusterIP here: there is exactly one Postgres replica in
# v1 (PROJECT.md §1 / §5: storage backend, not HA), so per-pod DNS is not
# needed and a plain ClusterIP keeps the receiver's DSN simple
# (postgres://…@data-governance-postgres:5432/…).
apiVersion: v1
kind: Service
metadata:
  name: data-governance-postgres
  namespace: data-governance
  labels:
    app.kubernetes.io/name: data-governance-postgres
    app.kubernetes.io/part-of: data-governance
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: data-governance-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
# Postgres StatefulSet — single replica, persistent volume.
#
# v1 keeps everything (PROJECT.md §5: no TTL, no tiering). The volume size
# is sized for development / demo use; operators bump it for longer-running
# deployments. Production-grade Postgres operations (backups, replication,
# tuning) are explicitly out of scope for v1.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: data-governance-postgres
  namespace: data-governance
  labels:
    app.kubernetes.io/name: data-governance-postgres
    app.kubernetes.io/part-of: data-governance
spec:
  serviceName: data-governance-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: data-governance-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-governance-postgres
        app.kubernetes.io/part-of: data-governance
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: data-governance-postgres
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: data-governance-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: data-governance-postgres
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "data_governance", "-d", "data_governance"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "data_governance", "-d", "data_governance"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
