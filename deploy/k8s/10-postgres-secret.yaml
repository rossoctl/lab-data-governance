---
# Postgres credentials.
#
# The values here are placeholders for v1 development / demo use. Operators
# rotating credentials should patch the Secret rather than committing
# real values into the manifest. PROJECT.md §2 / §5 frame Postgres as a v1
# storage backend without backups / replication / sizing — the credentials
# story is similarly minimal.
apiVersion: v1
kind: Secret
metadata:
  name: data-governance-postgres
  namespace: data-governance
  labels:
    app.kubernetes.io/name: data-governance-postgres
    app.kubernetes.io/part-of: data-governance
type: Opaque
stringData:
  POSTGRES_DB: data_governance
  POSTGRES_USER: data_governance
  # Placeholder — operators MUST replace before applying to anything other
  # than a throwaway dev cluster.
  POSTGRES_PASSWORD: change-me
