[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-governance"
version = "0.1.0"
description = "Data governance for Kagenti: OTEL span ingestion, storage, retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "alembic>=1.13",
    # OTLP receiver runtime: gRPC server (4317), HTTP/protobuf server (4318),
    # generated OTLP protobuf bindings.
    "grpcio>=1.62",
    "opentelemetry-proto>=1.25",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    # Synchronous OPA client for the interaction risk computation engine
    # (issue #101) — was dev-only (test HTTP client); now a runtime dependency.
    "httpx>=0.27",
]

[project.optional-dependencies]
# P-classification's in-process NER model runtime (issue #79, ADR-0022/0023).
# torch + transformers (~2 GB installed) live behind this OPTIONAL extra so ONLY
# the classification image installs them: its Containerfile.classification runs
# `uv sync --frozen --extra classification`, while the shared
# receiver/UI/interactions image's `uv sync --frozen --no-dev` (no extra) stays
# slim. `transformers` is pinned to the 4.57.x line the baked-in model weights
# were saved with (config.json `transformers_version` == 4.57.3) so the load path
# runs on the same generation that trained them — a cross-major bump (5.x) is
# untested against these weights and is exactly where the loader's breaking
# changes land. `torch` is the CPU wheel by default (the cluster has no GPU).
classification = [
    "torch>=2.2",
    "transformers>=4.57,<4.58",
]

[project.scripts]
# Migration CLI is invoked as `python -m data_governance.db.migrate`; no console script in v1.

[tool.hatch.build.targets.wheel]
packages = ["data_governance"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.7",
    # OTLP exporter SDKs used in tests as the canonical client side of the
    # OTLP wire protocol — tests construct real OTLP requests via these
    # exporters, never hand-rolled protobuf bytes.
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "pyyaml>=6.0.3",
    # Validates the shipped rules_source.json against the bundled
    # policy.schema.json (tests/risk/rules/test_schema_conformance.py).
    # Dev-only: nothing at runtime validates the catalog.
    "jsonschema>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
]
