[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-governance"
version = "0.1.0"
description = "Data governance for Kagenti: OTEL span ingestion, storage, retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "alembic>=1.13",
]

[project.scripts]
# CLI is invoked as `python -m data_governance.processors.otlp_receiver migrate`; no console script in v1.

[tool.hatch.build.targets.wheel]
packages = ["data_governance"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
]
