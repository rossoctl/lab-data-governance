notes: 'K2 with tier 2 (the crossed labels) absent at the first decision because the cross-conversation switch was off, not
  because it was slow: the timing of a gate''s limit is a live run''s, which this harness cannot show. Both conversations
  are sent and drained with the switch off; it is turned on (as a restart would) and both are derived again: switching on
  does not look back (R6), so conversation 1 registers its occurrences only when derived again, and conversation 2, derived
  while the switch was off, wrote no send rows a correction could find, so it is queued too. The crossing is drawn and the
  flagged decision recomputed. The history, every version, predicted from the mechanism before the run. cross: v1 allow at
  tier 1 (tiers 0 and 1 were on, nothing in conversation 2 is labelled), v2 block at tier 2 (the crossed SSN), stricter than
  v1: a late finding; v1 stands, the finding does not reach back. conv: the switch stays off whatever a step says, so tiers
  0 and 1 only: one version, [allow tier 1]. off: inherited labels off, tier 0 only; the crossing is drawn (the switch governs
  label lineage) but reaches no decision: one version, [allow tier 0].'
