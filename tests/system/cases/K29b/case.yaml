notes: 'K29 with a gate asking while label lineage is held back (the ask step). A decision is released when it is a block,
  or when the evidence is complete. Predicted from the mechanism before the run. conv and cross: at the ask the flagged request
  is classified and label lineage has not derived it, so the policy is asked on the classification alone; it blocks, and version
  1 is written there, tier 0, with nothing inherited in it. The drain then computes the full evidence: the chain''s labels
  reach leg 5, the record differs, version 2, a block again and so not a late finding. off: a classified leg is a ready leg,
  the ask computes the full record and the drain writes nothing more: one version. Red when the early question never fires
  (one version in conv and cross).'
